# Composite GitHub Action that wraps the OSS iris-security-cli (offline by default).
name: IRIS Agent Flight Recorder
description: >-
  Find every AI agent and AI call in your repo, flag ungoverned calls and AI
  supply chain risks, and threat model each agent against the OWASP LLM and
  Agentic Top 10. Runs offline with the open source IRIS CLI.
author: IRIS Security
branding:
  icon: shield
  color: red

outputs:
  high:
    description: High severity findings (flight-recorder)
    value: ${{ steps.iris.outputs.high }}
  medium:
    description: Medium severity findings (flight-recorder)
    value: ${{ steps.iris.outputs.medium }}
  ungoverned:
    description: AI calls not governed by IRIS (flight-recorder)
    value: ${{ steps.iris.outputs.ungoverned }}

inputs:
  command:
    description: 'What to run: "flight-recorder" (agents, ungoverned AI, supply chain, threat model), "compliance scan", or "policy validate"'
    required: false
    default: flight-recorder
  fail-on:
    description: >-
      When to fail the job. flight-recorder takes none, medium, or high
      (blocker means high, required means medium). compliance scan takes
      blocker, required, or none.
    required: false
    default: none
  license-key:
    description: Optional IRIS license key; adds the full threat model report with recommendations
    required: false
    default: ""
  iris-version:
    description: pip version specifier for iris-security-cli
    required: false
    default: ">=0.3.0"
  install:
    description: Set to "false" when the job already installed the IRIS CLI (for example from source)
    required: false
    default: "true"
  api-key:
    description: Optional IRIS Cloud API key — enables --push on compliance scan
    required: false
    default: ""
  working-directory:
    description: Directory to scan or validate
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install IRIS CLI
      if: inputs.install != 'false'
      shell: bash
      run: |
        python -m pip install --quiet "iris-security-cli${IRIS_VERSION}"
      env:
        IRIS_VERSION: ${{ inputs.iris-version }}

    - name: Run IRIS
      id: iris
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IRIS_API_KEY: ${{ inputs.api-key }}
        IRIS_COMMAND: ${{ inputs.command }}
        IRIS_FAIL_ON: ${{ inputs.fail-on }}
        IRIS_LICENSE_KEY: ${{ inputs.license-key }}
        IRIS_ACTION_PATH: ${{ github.action_path }}
        COLUMNS: "140"
      run: |
        set -euo pipefail

        push_flag=()
        if [ -n "${IRIS_API_KEY:-}" ]; then
          push_flag=(--push)
        fi

        case "${IRIS_COMMAND}" in
          "flight-recorder")
            out="${RUNNER_TEMP:-/tmp}/iris-flight-recorder"
            mkdir -p "$out"
            iris scan --discover --dir . --format json > "$out/scan.json" || true
            iris supply-chain --dir . --format json > "$out/supply.json" || true
            if [ -d governance/agents ]; then
              if [ -n "${IRIS_LICENSE_KEY:-}" ]; then
                iris threat-model --format md > "$out/threat-model.md" 2>/dev/null || true
              fi
              if [ ! -s "$out/threat-model.md" ]; then
                iris threat-model 2>/dev/null | grep -v "^Full report" > "$out/threat-model.txt" || true
              fi
            fi
            case "${IRIS_FAIL_ON}" in
              blocker|high) threshold=high ;;
              required|medium) threshold=medium ;;
              *) threshold=none ;;
            esac
            python3 "${IRIS_ACTION_PATH}/action/flight_recorder_summary.py" "$out" "$threshold"
            ;;
          "compliance scan")
            if iris compliance scan --help 2>&1 | grep -q -- '--fail-on'; then
              iris compliance scan --path . --json --fail-on "${IRIS_FAIL_ON}" "${push_flag[@]}"
            else
              iris compliance scan --path . --json "${push_flag[@]}" > /tmp/iris-scan.json
              FAIL_ON="${IRIS_FAIL_ON}" python3 -c "import json, os, sys; fail_on=os.environ['FAIL_ON']; rank={'blocker':0,'required':1,'recommended':2}; data=json.load(open('/tmp/iris-scan.json')); obligations=data.get('obligations',[]); threshold=rank[fail_on]; blocking=[o for o in obligations if rank.get(o.get('severity','recommended'),9)<=threshold]; sys.exit(1 if blocking and fail_on!='none' else 0)"
            fi
            ;;
          "policy validate")
            iris org-policy validate --strict
            ;;
          *)
            echo "Unknown command: ${IRIS_COMMAND}" >&2
            echo 'Supported: "flight-recorder", "compliance scan", "policy validate"' >&2
            exit 1
            ;;
        esac
