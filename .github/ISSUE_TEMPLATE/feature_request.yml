name: Feature request
description: Suggest an idea or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: markdown
    attributes:
      value: |
        Note: centralized/multi-org features (hosted policy management,
        SSO, org-wide reporting) are IRIS Cloud features and live outside
        this OSS repo. See CONTRIBUTING.md for the OSS/Cloud boundary
        before filing — it'll save a round trip.
